# MT5 Configuration (Exness MT5 via the official MetaTrader5 package + a Wine terminal)
#
# Credentials are NEVER hardcoded. Every value below is an ${ENV_VAR} reference
# that core/mt5_client.py resolves at construction time, so this file is safe to
# commit. Put the real values in .env (chmod 600, git-ignored):
#
#   export MT5_LOGIN=...
#   export MT5_PASSWORD=...
#   export MT5_SERVER=...
#   export MT5_PATH=...        # optional terminal path under Wine
mt5:
  login: "${MT5_LOGIN}"
  password: "${MT5_PASSWORD}"
  server: "${MT5_SERVER}"
  # Optional: explicit terminal path under Wine. Verified 2026-09-20 — the
  # terminal path argument is REQUIRED, not optional: attaching without a path
  # gives (-10005, 'IPC timeout') even with valid credentials.
  terminal_path: "${MT5_PATH}"

# Environment: demo or live
environment: demo

# Assets (bot symbols -> MT5 symbols mapped by core/symbols.py resolve_symbol)
assets:
  - symbol: "BTCUSD"
    name: "Bitcoin"
    category: "crypto"
  - symbol: "XAUUSD"
    name: "Gold"
    category: "metal"
  - symbol: "OILUSD"
    name: "Oil"
    mt5_symbol: "USOIL"
    category: "energy"
  - symbol: "XAGUSD"
    name: "Silver"
    category: "metal"

# Risk (mirrors strategies/default.yaml)
risk:
  daily_risk_cap: 0.01
  daily_profit_target: 0.03
