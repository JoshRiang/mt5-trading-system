name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # numpy is only needed by research/ (the bar/exit simulator).
      # Everything under core/ and analysis/ is stdlib-only on purpose, so the
      # suite below runs with nothing but pytest installed.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy

      - name: Run the test suite
        run: python -m pytest tests/ -v

      # research/test_engine.py is a self-checking script rather than a pytest
      # module (it prints PASS/FAIL per assertion and exits non-zero on failure).
      # It validates the simulator's fill model, so it is worth running too.
      - name: Simulator self-check (fill model, no-lookahead, determinism)
        run: python research/test_engine.py

      - name: Forensics script must run and reproduce the headline arithmetic
        run: |
          python analysis/trade_forensics.py --help
          python -c "
          import json, subprocess, sys
          p = subprocess.run([sys.executable, 'analysis/trade_forensics.py', '--help'],
                             capture_output=True, text=True)
          assert p.returncode == 0
          print('forensics --help ok')
          "

  secrets:
    name: no credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a credential looks committed
        run: |
          set -e
          # Anything that looks like an assignment of a real secret value.
          # ${VAR} references and empty values are fine; literals are not.
          if grep -rnE "(password|passwd|api[_-]?key|api[_-]?secret|token)[\"']?\s*[:=]\s*[\"'][^\"'$]{8,}[\"']" \
               --include="*.py" --include="*.yaml" --include="*.yml" --include="*.json" . ; then
            echo "::error::a literal credential appears to be committed"
            exit 1
          fi
          if [ -f .env ]; then
            echo "::error::.env must never be committed"
            exit 1
          fi
          echo "no literal credentials found"
