# Kelly Momentum strategy — SIMPLE single-signal alternative to default.yaml
# Signal: 1s/1m EMA(3) vs EMA(8) + momentum burst + Donchian breakout (reuse gamble_multi_v3 params)
# Sizing: Kelly f*=(p*(b+1)-1)/b, b=3 (RR 1:3), half-Kelly, capped at 1% equity risk/trade
# STATUS: DEFINED + VALIDATED ONLY — NOT wired into live bot. Do NOT auto-switch main.py/run.py.
# Live bot still uses strategies/default.yaml until user explicitly switches.

meta:
  name: kelly_momentum
  version: 1
  status: defined_only  # do not auto-switch live bot to this
  source_params: gamble_multi_v3.py  # signal params reused verbatim

assets:
  - BTCUSD
  - XAUUSD
  - USOIL

# --- Momentum signal (gamble_multi_v3 values, price-relative so one set fits all) ---
signal:
  fast_ema: 3
  slow_ema: 8
  min_sep_bps: 0.3          # |fast-slow|/slow*10000 must exceed this
  mom_pct: 0.00005          # momentum burst: |mid - mid_10s_ago| >= mid*mom_pct
  mom_window_sec: 10
  spread_cap_pct: 0.00015   # skip entry if spread > mid*spread_cap_pct
  lookback: 60              # Donchian breakout window (ticks)
  tick_poll_sec: 1.0
  cooldown_sec: 3
  # BUY  = fast>slow + sep>=min_sep_bps + mom>=mom_min + mid>=highest(lookback) + spread ok
  # SELL = mirror image

# --- Exits (gamble_multi_v3 values) ---
exits:
  sl_pct: 0.0006            # SL distance = 0.06% of mid
  tp_mult: 3.0              # TP = 3x SL  -> RR 1:3 -> b=3 for Kelly
  trail_trig_pct: 0.00025
  trail_dist_pct: 0.00012
  max_hold_sec: 150
  # RECOVERY TWEAK v2 (backtested 2026-09-21 on 212 CLOSED: TIME -32.72 -> +17.19,
  # lift +49.91; TRAIL 96.5% WR is the paying engine — let it decide, not the clock):
  timeout_extend_sec: 150   # underwater at timeout -> EXTEND once, arm breakeven stop
  timeout_max_extends: 1    # exactly one extension, then accept market price
  be_buffer_pct: 0.00002    # breakeven stop buffer (covers slip, keeps RR 1:3 intact)

# --- Kelly sizing ---
kelly:
  b: 3.0                    # payoff ratio = RR 1:3
  # f* = (p*(b+1) - 1) / b
  p_source: recent_closed_win_rate_per_symbol  # last N CLOSED trades, this strategy/symbol
  p_lookback_trades: 50
  p_fallback: 0.55          # used when fewer than min_history closed trades
  min_history: 10
  kelly_fraction: half      # bet half-Kelly: f = f*/2
  max_risk_per_trade: 0.01  # 1% equity cap AFTER Kelly (Kelly almost always exceeds it)
  max_lot: 1.0
  floor_f_star_at_zero: true  # f*<0 -> no trade (p below breakeven 1/(b+1)=0.25)

# --- Hard risk caps ---
risk:
  daily_cap: 0.01           # 1% equity per day, all symbols combined
  max_pos_per_symbol: 1
  max_open_positions: 3
  max_trades: 500
  max_runtime_hrs: 12.0
  equity_floor: 100.0
  equity_target: 1000.0

# breakeven win-rate for b=3: p0 = 1/(b+1) = 0.25. Any p>0.25 gives f*>0.
# worked example (equity $10k): p=0.55 -> f*=(0.55*4-1)/3=0.40 -> half=0.20
#   -> capped to 1% => risk $100/trade. See core/kelly.py kelly_risk_usd().
